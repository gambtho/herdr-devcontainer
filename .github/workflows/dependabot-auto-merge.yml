name: Dependabot auto-merge

# Dependabot opens its pull requests from branches in this repository, so this
# runs on `pull_request` rather than `pull_request_target`. That matters: a fork
# pull request never receives a write-scoped token on this event, so the
# permissions below cannot be borrowed by untrusted code.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: enable auto-merge
    runs-on: ubuntu-latest
    # Belt and braces alongside the token scoping above.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Auto-merge queues the merge; it does not bypass anything. The branch
      # protection on main still requires both CI jobs to pass, so a bad bump
      # sits as an open pull request instead of landing.
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A major bump is where an action drops an input or changes defaults, so
      # leave a note and let a human look.
      - name: Flag major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Check the action's changelog for removed inputs or changed defaults before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">herdr-devcontainer — Dev Container panes for Herdr</title>
  <desc id="desc">A repository devcontainer.json flows through the herdr-devcontainer plugin, which detects the repository, runs devcontainer up, and opens shell or coding-agent panes inside the resulting Dev Container.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#76e6a3"/>
      <stop offset="1" stop-color="#6db8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22314b" stroke-opacity=".27" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02050c" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a1020"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <text x="56" y="62" fill="#76e6a3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">HERDR PLUGIN</text>
  <text x="56" y="118" fill="#f3f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="760">herdr-devcontainer</text>
  <text x="56" y="157" fill="#a9b8d0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Run Herdr shells and coding agents inside the Dev Container your repo already defines.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="212" width="318" height="286" rx="22" fill="#121b31" stroke="#2d4162" stroke-width="2"/>
  </g>
  <text x="74" y="248" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">REPOSITORY</text>
  <rect x="74" y="270" width="266" height="91" rx="12" fill="#0d1528" stroke="#365273"/>
  <path d="M95 292h22l9 9h42v39H95z" fill="#182944" stroke="#6db8ff" stroke-width="2"/>
  <text x="184" y="310" fill="#6db8ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">.devcontainer/</text>
  <text x="184" y="334" fill="#f3f7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">devcontainer.json</text>
  <line x1="74" y1="382" x2="340" y2="382" stroke="#2d4162"/>
  <text x="74" y="412" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">git root</text>
  <text x="160" y="412" fill="#f3f7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">~/src/repo</text>
  <text x="74" y="446" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">pane cwd</text>
  <text x="160" y="446" fill="#f3f7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">services/api</text>
  <rect x="74" y="465" width="149" height="22" rx="11" fill="#173124"/>
  <text x="148.5" y="480" text-anchor="middle" fill="#76e6a3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">existing config</text>

  <path d="M382 350H438" stroke="#76e6a3" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 340l12 10-12 10" fill="none" stroke="#76e6a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="329" text-anchor="middle" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">context</text>

  <g filter="url(#shadow)">
    <rect x="450" y="212" width="378" height="286" rx="22" fill="#121b31" stroke="#3a5a58" stroke-width="2"/>
  </g>
  <text x="476" y="248" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">HERDR</text>
  <rect x="476" y="267" width="326" height="56" rx="14" fill="#132c25" stroke="#76e6a3" stroke-width="2"/>
  <text x="639" y="302" text-anchor="middle" fill="#76e6a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">devcontainer plugin</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">
    <rect x="476" y="347" width="92" height="34" rx="17" fill="#182944" stroke="#6db8ff"/>
    <text x="522" y="369" text-anchor="middle" fill="#6db8ff">detect</text>
    <path d="M577 364h26" stroke="#5a718f" stroke-width="2"/>
    <path d="M598 358l7 6-7 6" fill="none" stroke="#5a718f" stroke-width="2"/>
    <rect x="614" y="347" width="82" height="34" rx="17" fill="#173124" stroke="#76e6a3"/>
    <text x="655" y="369" text-anchor="middle" fill="#76e6a3">up</text>
    <path d="M705 364h26" stroke="#5a718f" stroke-width="2"/>
    <path d="M726 358l7 6-7 6" fill="none" stroke="#5a718f" stroke-width="2"/>
    <rect x="742" y="347" width="60" height="34" rx="17" fill="#2e2817" stroke="#f2c66d"/>
    <text x="772" y="369" text-anchor="middle" fill="#f2c66d">exec</text>
  </g>
  <line x1="476" y1="405" x2="802" y2="405" stroke="#2d4162"/>
  <text x="476" y="432" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">ENTRYPOINTS</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">
    <rect x="476" y="445" width="92" height="34" rx="10" fill="#0d1528" stroke="#4b6789"/>
    <text x="522" y="467" text-anchor="middle" fill="#f3f7ff">shell</text>
    <rect x="580" y="445" width="112" height="34" rx="10" fill="#0d1528" stroke="#4b6789"/>
    <text x="636" y="467" text-anchor="middle" fill="#f3f7ff">command</text>
    <rect x="704" y="445" width="98" height="34" rx="10" fill="#2b2118" stroke="#f2c66d"/>
    <text x="753" y="467" text-anchor="middle" fill="#f2c66d">stop ✓</text>
  </g>

  <path d="M844 350H900" stroke="#6db8ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M892 340l12 10-12 10" fill="none" stroke="#6db8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="872" y="329" text-anchor="middle" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">CLI</text>

  <g filter="url(#shadow)">
    <rect x="914" y="212" width="318" height="286" rx="22" fill="#121b31" stroke="#3b5980" stroke-width="2"/>
  </g>
  <text x="940" y="248" fill="#8ea4c4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">DEV CONTAINER</text>
  <rect x="940" y="267" width="266" height="32" rx="16" fill="#172941"/>
  <text x="1073" y="288" text-anchor="middle" fill="#6db8ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">official Dev Containers CLI</text>
  <rect x="940" y="319" width="266" height="151" rx="12" fill="#080d18" stroke="#334968"/>
  <circle cx="961" cy="339" r="4" fill="#ff8f8f"/>
  <circle cx="975" cy="339" r="4" fill="#f2c66d"/>
  <circle cx="989" cy="339" r="4" fill="#76e6a3"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <text x="958" y="373" fill="#76e6a3">vscode@container</text>
    <text x="1067" y="373" fill="#8ea4c4">:</text>
    <text x="1078" y="373" fill="#6db8ff">/workspaces/repo</text>
    <text x="958" y="399" fill="#8ea4c4">$</text>
    <text x="976" y="399" fill="#f3f7ff">claude</text>
    <text x="958" y="425" fill="#8ea4c4">$</text>
    <text x="976" y="425" fill="#f3f7ff">cargo test</text>
    <text x="958" y="451" fill="#8ea4c4">real PTY · docker exec -it</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">
    <rect x="56" y="544" width="210" height="40" rx="20" fill="#132c25" stroke="#315846"/>
    <text x="161" y="569" text-anchor="middle" fill="#76e6a3">same repo config</text>
    <rect x="282" y="544" width="218" height="40" rx="20" fill="#172941" stroke="#365273"/>
    <text x="391" y="569" text-anchor="middle" fill="#6db8ff">visible bring-up</text>
    <rect x="516" y="544" width="258" height="40" rx="20" fill="#172941" stroke="#365273"/>
    <text x="645" y="569" text-anchor="middle" fill="#6db8ff">one container per repo</text>
    <rect x="790" y="544" width="258" height="40" rx="20" fill="#2b2118" stroke="#6b5630"/>
    <text x="919" y="569" text-anchor="middle" fill="#f2c66d">confirmed explicit stop</text>
    <rect x="1064" y="544" width="160" height="40" rx="20" fill="#171d2d" stroke="#3d4b66"/>
    <text x="1144" y="569" text-anchor="middle" fill="#a9b8d0">Linux · WSL2</text>
  </g>

  <text x="1224" y="614" text-anchor="end" fill="#61738f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">gambtho/herdr-devcontainer</text>
</svg>
